<section class="section" id="contact">
  <div class="wrap contact-grid">
    <div>
      <p class="eyebrow">Contact</p>
      <h2>Get in touch</h2>
      <p class="lead">Questions about UVL, ideas for collaboration or interest in using it in industry? Write to the core team.</p>
      <div class="panel">
        <h3>Technical question?</h3>
        <p class="muted">Ask in public so the whole community benefits from the answer.</p>
        <a class="text-link" href="https://github.com/{{ site.github_org }}/UVLEP/discussions">GitHub Discussions →</a><br>
        <a class="text-link" href="https://github.com/{{ site.github_org }}/uvl-parser/issues">Parser issues →</a>
      </div>
    </div>

    <form class="contact-form" id="contact-form" method="POST"
          action="{{ site.contact.form_endpoint }}"
          data-endpoint="{{ site.contact.form_endpoint }}"
          data-fallback="{{ site.contact.fallback_email }}">
      <div class="field-row">
        <label>Name<input name="name" type="text" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
      </div>
      <label>Affiliation <span class="muted">(optional)</span><input name="affiliation" type="text" autocomplete="organization"></label>
      <label>Topic
        <select name="topic" required>
          <option>General question</option>
          <option>I want to contribute</option>
          <option>Add my tool to the ecosystem</option>
          <option>Research collaboration</option>
          <option>Industrial use</option>
          <option>Other</option>
        </select>
      </label>
      <label>Message<textarea name="message" rows="6" required></textarea></label>
      <!-- Honeypot: bots fill it, humans never see it -->
      <label class="hp" aria-hidden="true">Leave empty<input name="_gotcha" type="text" tabindex="-1" autocomplete="off"></label>
      <label class="check"><input name="consent" type="checkbox" required> I agree that my data is used only to answer this message.</label>
      <button class="btn btn-primary" type="submit">Send message</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
